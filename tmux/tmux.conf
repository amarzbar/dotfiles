# ---- General ------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",xterm-ghostty:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10          # snappy Esc for nvim
set -g focus-events on          # nvim autoread
set -g set-clipboard on
setw -g mode-keys vi

# ---- Prefix: Ctrl-Space ---------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---- Keys -----------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# Visual mode: prefix + v enters copy mode (prefix + [ also works).
#   v = select, V = select line, C-v = block select, y = yank to clipboard,
#   q / Esc = leave
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle \; send -X begin-selection
if-shell "uname | grep -q Darwin" \
    'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"' \
    'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"'
bind -T copy-mode-vi Escape send -X cancel

# ---- Theme: follows the terminal palette ------------------------------------
# Only ANSI colour indices + "default" are used, so tmux inherits whatever
# theme kitty is running, and the background stays transparent.
# colour0 surface  colour8 muted  colour1/9 red/pink  colour2 green
# colour4 blue  colour5 purple  colour7 bright fg
set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=default"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=colour5,bold]  #S #{?client_prefix,#[fg=colour9]● PREFIX ,}#[fg=colour8]│ "
set -g status-right "#[fg=colour8]│ #[fg=colour4] #(whoami)@#h #[fg=colour8]│ #[fg=colour2]󰃭 %a %d %b #[fg=colour8]│ #[fg=colour9,bold] %H:%M "
setw -g window-status-separator ""
setw -g window-status-format "#[fg=colour8] #I #W "
setw -g window-status-current-format "#[fg=colour9,bold] #I #[fg=colour7]#W#{?window_zoomed_flag, 󰊓,} "
setw -g window-style "bg=default"
setw -g window-active-style "bg=default"
set -g pane-border-style "fg=colour0,bg=default"
set -g pane-active-border-style "fg=colour5,bg=default"
set -g message-style "bg=default,fg=colour7"
set -g message-command-style "bg=default,fg=colour7"
setw -g mode-style "bg=colour5,fg=colour0"
set -g display-panes-active-colour colour9
set -g display-panes-colour colour4
setw -g clock-mode-colour colour9
